<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>EXA — Orbit</title>
<meta name="description" content="EXA — social links and the Exa Vault, floating in space.">

<style>
  /* ============================================================
     TOKENS
     ============================================================ */
  :root{
    --void:        #040309;
    --void-2:      #0a0716;
    --void-3:      #100c22;
    --gold:        #d4af6a;
    --gold-soft:   #f2ddb0;
    --violet:      #9b7bff;
    --violet-deep: #5c3fb8;
    --cyan:        #5ad1ff;
    --cyan-deep:   #2467a8;
    --text:        #f3efe6;
    --text-dim:    #a89fc2;
    --glass:       rgba(18, 14, 34, 0.55);
    --glass-brd:   rgba(212, 175, 106, 0.28);

    --font-display: 'Cormorant Garamond', Georgia, serif;
    --font-body:    'Inter', -apple-system, BlinkMacSystemFont, sans-serif;

    --ease: cubic-bezier(.22,.61,.36,1);
  }

  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background: radial-gradient(ellipse 120% 90% at 50% -10%, var(--void-3) 0%, var(--void-2) 45%, var(--void) 100%);
    color: var(--text);
    font-family: var(--font-body);
    overflow-x:hidden;
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
  }

  a{ color:inherit; }
  button{ font-family:inherit; }

  ::selection{ background: var(--gold); color: var(--void); }

  :focus-visible{
    outline: 1.5px solid var(--gold-soft);
    outline-offset: 4px;
    border-radius: 2px;
  }

  /* ============================================================
     STARFIELD CANVAS
     ============================================================ */
  #stars{
    position: fixed;
    inset: 0;
    z-index: 0;
    display:block;
  }

  /* ============================================================
     SHELL
     ============================================================ */
  .shell{
    position: relative;
    z-index: 2;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  /* ---------- header ---------- */
  header.top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: clamp(20px, 4vw, 40px) clamp(20px, 5vw, 56px);
    gap: 16px;
  }
  .wordmark{
    font-family: var(--font-display);
    font-size: clamp(22px, 3vw, 30px);
    letter-spacing: 0.38em;
    font-weight: 600;
    color: var(--gold-soft);
    text-shadow: 0 0 24px rgba(212,175,106,0.35);
  }
  .tagline{
    font-size: 11px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--text-dim);
    text-align: right;
    max-width: 220px;
    line-height: 1.7;
  }

  /* ---------- orbit field (main stage) ---------- */
  main.orbit-field{
    flex: 1;
    display:flex;
    align-items:center;
    justify-content:center;
    position: relative;
    padding: 20px clamp(16px, 6vw, 60px) 60px;
  }

  .constellation{
    position: relative;
    width: 100%;
    max-width: 1180px;
    display:flex;
    align-items:center;
    justify-content: space-evenly;
    gap: clamp(40px, 8vw, 140px);
    flex-wrap: wrap;
  }

  /* ============================================================
     PLANET
     ============================================================ */
  .planet-wrap{
    position: relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 22px;
    animation: float 7s ease-in-out infinite;
  }
  .planet-wrap.b{ animation-delay: -3.4s; }

  .planet-btn{
    position: relative;
    width: clamp(150px, 24vw, 230px);
    height: clamp(150px, 24vw, 230px);
    border-radius: 50%;
    border: none;
    cursor: pointer;
    background: transparent;
    padding: 0;
    isolation: isolate;
  }

  .ring{
    position:absolute;
    inset: -22%;
    border-radius: 50%;
    border: 1px solid var(--glass-brd);
    transform: rotateX(72deg);
    animation: spin 34s linear infinite;
    pointer-events:none;
  }
  .ring::before{
    content:'';
    position:absolute;
    top:50%; left:50%;
    width:6px; height:6px;
    background: var(--gold-soft);
    border-radius:50%;
    box-shadow: 0 0 8px 2px var(--gold-soft);
    transform: translate(-50%,-50%) rotateX(-72deg) translateX(calc(50 * 1%)) translateX(105px);
  }

  .sphere{
    position:absolute;
    inset:0;
    border-radius:50%;
    overflow:hidden;
    animation: rotate-surface 50s linear infinite;
    box-shadow:
      inset -18px -18px 40px rgba(0,0,0,0.55),
      inset 10px 10px 30px rgba(255,255,255,0.06);
    transition: transform .5s var(--ease), box-shadow .5s var(--ease);
  }
  .planet-btn:hover .sphere,
  .planet-btn:focus-visible .sphere{
    transform: scale(1.045);
  }

  .planet-social .sphere{
    background:
      radial-gradient(circle at 32% 28%, rgba(255,255,255,0.5), transparent 22%),
      repeating-radial-gradient(circle at 50% 50%, var(--violet) 0 3%, var(--violet-deep) 4% 7%),
      radial-gradient(circle at 65% 70%, var(--violet-deep), #241355 70%);
  }
  .planet-vault .sphere{
    background:
      radial-gradient(circle at 32% 28%, rgba(255,255,255,0.5), transparent 22%),
      repeating-conic-gradient(from 0deg, var(--cyan-deep) 0deg 8deg, var(--cyan) 9deg 10deg, var(--cyan-deep) 11deg 24deg),
      radial-gradient(circle at 65% 70%, var(--cyan-deep), #06283f 75%);
  }

  .glow{
    position:absolute;
    inset: -30%;
    border-radius:50%;
    z-index:-1;
    filter: blur(26px);
    opacity: .55;
    animation: breathe 5.5s ease-in-out infinite;
  }
  .planet-social .glow{ background: radial-gradient(circle, var(--violet) 0%, transparent 70%); }
  .planet-vault .glow{ background: radial-gradient(circle, var(--cyan) 0%, transparent 70%); }

  .planet-label{
    text-align:center;
  }
  .planet-name{
    font-family: var(--font-display);
    font-size: clamp(20px, 2.4vw, 26px);
    letter-spacing: 0.12em;
    font-weight:600;
    color: var(--text);
  }
  .planet-hint{
    display:block;
    margin-top: 4px;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  /* ---------- footer ---------- */
  footer.bottom{
    text-align:center;
    padding: 18px 20px 26px;
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--text-dim);
    opacity: .7;
  }

  /* ============================================================
     PANEL (modal)
     ============================================================ */
  .panel-layer{
    position: fixed;
    inset: 0;
    z-index: 20;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 24px;
    visibility: hidden;
    pointer-events:none;
  }
  .panel-layer.open{ visibility: visible; pointer-events:auto; }

  .panel-backdrop{
    position:absolute;
    inset:0;
    background: rgba(3,2,8,0.72);
    backdrop-filter: blur(6px);
    opacity:0;
    transition: opacity .4s var(--ease);
  }
  .panel-layer.open .panel-backdrop{ opacity:1; }

  .panel{
    position: relative;
    width: 100%;
    max-width: 420px;
    max-height: 82dvh;
    overflow-y: auto;
    background: var(--glass);
    border: 1px solid var(--glass-brd);
    border-radius: 18px;
    padding: clamp(24px, 5vw, 36px);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    box-shadow: 0 30px 80px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.02) inset;
    transform: translateY(24px) scale(.97);
    opacity: 0;
    transition: transform .45s var(--ease), opacity .4s var(--ease);
  }
  .panel-layer.open .panel{ transform: translateY(0) scale(1); opacity:1; }

  .panel-close{
    position:absolute;
    top: 16px; right: 16px;
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 1px solid var(--glass-brd);
    background: rgba(255,255,255,0.04);
    color: var(--text-dim);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: color .2s, border-color .2s, transform .2s;
  }
  .panel-close:hover{ color: var(--gold-soft); border-color: var(--gold); transform: rotate(90deg); }
  .panel-close svg{ width:14px; height:14px; }

  .panel-eyebrow{
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--gold);
    margin: 0 0 6px;
  }
  .panel-title{
    font-family: var(--font-display);
    font-size: clamp(26px, 4vw, 32px);
    font-weight: 600;
    margin: 0 0 6px;
  }
  .panel-sub{
    font-size: 13px;
    color: var(--text-dim);
    margin: 0 0 26px;
    line-height:1.6;
  }

  .divider{
    height:1px;
    background: linear-gradient(90deg, transparent, var(--glass-brd), transparent);
    margin: 20px 0;
  }

  /* ---- link rows (used by both panels) ---- */
  .link-list{
    list-style:none;
    margin:0; padding:0;
    display:flex;
    flex-direction:column;
    gap: 10px;
  }
  .link-row{
    display:flex;
    align-items:center;
    gap: 14px;
    padding: 13px 16px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.03);
    text-decoration:none;
    color: var(--text);
    transition: background .25s, border-color .25s, transform .2s;
  }
  .link-row:hover, .link-row:focus-visible{
    background: rgba(212,175,106,0.08);
    border-color: var(--glass-brd);
    transform: translateX(3px);
  }
  .link-icon{
    flex: 0 0 auto;
    width: 38px; height: 38px;
    border-radius: 10px;
    display:flex;
    align-items:center;
    justify-content:center;
    background: rgba(255,255,255,0.06);
  }
  .link-icon svg{ width:18px; height:18px; }
  .link-body{ flex:1; min-width:0; }
  .link-name{ font-size: 14px; font-weight:600; letter-spacing:.01em; }
  .link-meta{ font-size: 11.5px; color: var(--text-dim); margin-top:1px; }
  .link-arrow{ flex: 0 0 auto; opacity:.5; transition: transform .25s, opacity .25s; }
  .link-row:hover .link-arrow{ transform: translateX(3px); opacity:1; }

  .empty-note{
    font-size: 12.5px;
    color: var(--text-dim);
    text-align:center;
    padding: 18px 10px;
    border: 1px dashed rgba(255,255,255,0.12);
    border-radius: 12px;
  }

  /* ============================================================
     MOTION KEYFRAMES
     ============================================================ */
  @keyframes float{
    0%,100%{ transform: translateY(0); }
    50%{ transform: translateY(-16px); }
  }
  @keyframes spin{
    from{ transform: rotateX(72deg) rotateZ(0deg); }
    to{ transform: rotateX(72deg) rotateZ(360deg); }
  }
  @keyframes rotate-surface{
    from{ background-position: 0 0, 0 0, 0 0; }
    to{ background-position: 240px 0, 0 0, 0 0; }
  }
  @keyframes breathe{
    0%,100%{ opacity:.4; transform: scale(1); }
    50%{ opacity:.65; transform: scale(1.08); }
  }
  @keyframes drift{
    from{ transform: translate3d(120vw, -10vh, 0) rotate(-18deg); opacity:0; }
    5%{ opacity:1; }
    90%{ opacity:1; }
    to{ transform: translate3d(-30vw, 46vh, 0) rotate(-18deg); opacity:0; }
  }
  .comet{
    position: fixed;
    top:0; left:0;
    width: 2px; height: 2px;
    z-index: 1;
    pointer-events:none;
  }
  .comet::before{
    content:'';
    position:absolute;
    width: 130px; height: 1.4px;
    right: 0;
    background: linear-gradient(90deg, transparent, var(--gold-soft) 60%, #fff);
    box-shadow: 0 0 8px 1px rgba(242,221,176,0.8);
  }
  .comet{ animation: drift 3.4s linear forwards; }

  @media (prefers-reduced-motion: reduce){
    .planet-wrap, .ring, .sphere, .glow, .comet{ animation: none !important; }
  }

  @media (max-width: 560px){
    .tagline{ display:none; }
    header.top{ justify-content:center; }
    .ring{ display:none; }
  }
</style>
</head>
<body>

<canvas id="stars" aria-hidden="true"></canvas>

<div class="shell">

  <header class="top">
    <div class="wordmark">EXA</div>
    <div class="tagline">Two worlds.<br>Choose your orbit.</div>
  </header>

  <main class="orbit-field">
    <div class="constellation">

      <!-- PLANET 1 — SOCIAL -->
      <div class="planet-wrap a">
        <button class="planet-btn planet-social" id="btn-social" aria-haspopup="dialog" aria-controls="panel-social">
          <span class="glow"></span>
          <span class="ring"></span>
          <span class="sphere"></span>
        </button>
        <div class="planet-label">
          <span class="planet-name">Social</span>
          <span class="planet-hint">Tap to connect</span>
        </div>
      </div>

      <!-- PLANET 2 — EXA VAULT -->
      <div class="planet-wrap b">
        <button class="planet-btn planet-vault" id="btn-vault" aria-haspopup="dialog" aria-controls="panel-vault">
          <span class="glow"></span>
          <span class="ring"></span>
          <span class="sphere"></span>
        </button>
        <div class="planet-label">
          <span class="planet-name">Exa Vault</span>
          <span class="planet-hint">Tap to explore</span>
        </div>
      </div>

    </div>
  </main>

  <footer class="bottom">EXA &middot; ORBIT &middot; <span id="year"></span></footer>
</div>

<!-- ================= PANEL: SOCIAL ================= -->
<div class="panel-layer" id="panel-social">
  <div class="panel-backdrop" data-close></div>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="social-title">
    <button class="panel-close" data-close aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4l16 16M20 4L4 20"/></svg>
    </button>
    <p class="panel-eyebrow">Planet Venus</p>
    <h2 class="panel-title" id="social-title">Social</h2>
    <p class="panel-sub">Find EXA across the galaxy.</p>
    <ul class="link-list" id="social-links"><!-- rendered by JS --></ul>
  </div>
</div>

<!-- ================= PANEL: EXA VAULT ================= -->
<div class="panel-layer" id="panel-vault">
  <div class="panel-backdrop" data-close></div>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="vault-title">
    <button class="panel-close" data-close aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4l16 16M20 4L4 20"/></svg>
    </button>
    <p class="panel-eyebrow">Kepler planet</p>
    <h2 class="panel-title" id="vault-title">Exa Vault</h2>
    <p class="panel-sub">Tools .</p>
    <ul class="link-list" id="vault-links"><!-- rendered by JS --></ul>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ============================================================
     1. STARFIELD  (lightweight canvas, twinkle only — no heavy libs)
     ============================================================ */
  const canvas = document.getElementById('stars');
  const ctx = canvas.getContext('2d');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let stars = [];
  let w, h, dpr;

  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    seedStars();
  }

  function seedStars(){
    const count = Math.round((w * h) / 8000);
    stars = new Array(count).fill(0).map(() => ({
      x: Math.random() * w,
      y: Math.random() * h,
      r: Math.random() * 1.3 + 0.2,
      base: Math.random() * 0.5 + 0.3,
      speed: Math.random() * 0.02 + 0.005,
      phase: Math.random() * Math.PI * 2
    }));
  }

  let t = 0;
  function draw(){
    ctx.clearRect(0,0,w,h);
    for(const s of stars){
      const twinkle = reduceMotion ? s.base : s.base + Math.sin(t * s.speed * 40 + s.phase) * 0.4;
      ctx.globalAlpha = Math.max(0, Math.min(1, twinkle));
      ctx.fillStyle = '#f3efe6';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    t += 1;
    if(!reduceMotion) requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize);
  resize();
  draw();

  /* ============================================================
     2. OCCASIONAL COMET (pure CSS animation, spawned in JS)
     ============================================================ */
  function spawnComet(){
    if(reduceMotion) return;
    const c = document.createElement('span');
    c.className = 'comet';
    c.style.top = (Math.random()*40) + 'vh';
    document.body.appendChild(c);
    c.addEventListener('animationend', () => c.remove());
  }
  if(!reduceMotion){
    setInterval(spawnComet, 9000 + Math.random()*6000);
    setTimeout(spawnComet, 2200);
  }

  /* ============================================================
     3. DATA — edit these arrays to add/remove links. That's it.
     ============================================================ */

  // Icons (inline SVG strings, currentColor so they inherit theme color)
  const ICONS = {
    tiktok: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.6 5.82c-1-.87-1.6-2.14-1.6-3.55h-3.15v13.4c0 1.53-1.24 2.77-2.77 2.77a2.77 2.77 0 0 1 0-5.54c.28 0 .55.04.8.12V9.9a5.9 5.9 0 0 0-.8-.06 5.92 5.92 0 1 0 5.92 5.92V8.62a7.63 7.63 0 0 0 4.47 1.43V6.9a4.53 4.53 0 0 1-2.87-1.08z"/></svg>`,
    download: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 19h16"/></svg>`,
    arrow: `<svg class="link-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`
  };

  // --- Planet 1: Social -------------------------------------------------
  // Add a new object to this array for every new social platform.
  // icon: any key from ICONS above, or paste a raw <svg>...</svg> string.
  const SOCIAL_LINKS = [
    {
      name: "TikTok",
      meta: "@فَـهَدَ",
      url: "https://www.tiktok.com/@MS4wLjABAAAASiCWw9Dm8XMEGPOxDiMbpKfw7FQt62GcbOnZDo-EIK83ZSL_iaTNH_hfOJQf5-_a?is_from_webapp=1&sender_device=pc",
      icon: ICONS.tiktok
    }
    // {
    //   name: "Instagram",
    //   meta: "@exa",
    //   url: "https://instagram.com/exa",
    //   icon: "<svg ...>...</svg>"
    // },
  ];

  // --- Planet 2: Exa Vault ------------------------------------------------
  // Add a new object to this array for every downloadable tool/file.
  const VAULT_LINKS = [
    {
      name: "Exa ",
      meta: "v1.0 · ",
      url: "https://github.com/FHOoO1/Exa/releases/download/v1%2C0%2C0/exa.rar",
      icon: ICONS.download
    }
    // {
    //   name: "Exa CLI",
    //   meta: "v0.9 · macOS",
    //   url: "#",
    //   icon: ICONS.download
    // },
  ];

  /* ============================================================
     4. RENDER LINK LISTS
     ============================================================ */
  function renderLinks(containerId, items){
    const el = document.getElementById(containerId);
    if(!items || !items.length){
      el.innerHTML = `<li class="empty-note">Nothing in orbit yet.</li>`;
      return;
    }
    el.innerHTML = items.map(item => `
      <li>
        <a class="link-row" href="${item.url}" target="_blank" rel="noopener noreferrer">
          <span class="link-icon">${item.icon}</span>
          <span class="link-body">
            <span class="link-name">${item.name}</span>
            <span class="link-meta">${item.meta || ''}</span>
          </span>
          ${ICONS.arrow}
        </a>
      </li>
    `).join('');
  }

  renderLinks('social-links', SOCIAL_LINKS);
  renderLinks('vault-links', VAULT_LINKS);

  /* ============================================================
     5. PANEL OPEN / CLOSE
     ============================================================ */
  let lastFocused = null;

  function openPanel(panel){
    lastFocused = document.activeElement;
    panel.classList.add('open');
    const closeBtn = panel.querySelector('.panel-close');
    if(closeBtn) closeBtn.focus();
    document.addEventListener('keydown', onKeydown);
  }
  function closePanel(panel){
    panel.classList.remove('open');
    document.removeEventListener('keydown', onKeydown);
    if(lastFocused) lastFocused.focus();
  }
  function onKeydown(e){
    if(e.key === 'Escape'){
      document.querySelectorAll('.panel-layer.open').forEach(closePanel);
    }
  }

  const panelSocial = document.getElementById('panel-social');
  const panelVault  = document.getElementById('panel-vault');

  document.getElementById('btn-social').addEventListener('click', () => openPanel(panelSocial));
  document.getElementById('btn-vault').addEventListener('click', () => openPanel(panelVault));

  document.querySelectorAll('[data-close]').forEach(el => {
    el.addEventListener('click', (e) => closePanel(e.target.closest('.panel-layer')));
  });

  /* ============================================================
     6. MISC
     ============================================================ */
  document.getElementById('year').textContent = new Date().getFullYear();

})();
</script>

</body>
</html>
